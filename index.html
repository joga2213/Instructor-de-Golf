<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style></head><body>
<title>Mi Profesor de Golf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: una columna tranquila, letra grande; el avance es una tarjeta de puntuación de 8 hoyos. */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --ink:#15281c; --muted:#4d6155; --line:#d3ddd4;
  --green:#1d5b37; --green-2:#2f7a4c; --green-soft:#e1ede4; --flag:#f2c230; --flag-ink:#3a2c00;
  --alert:#a3261b; --alert-soft:#fbe9e6; --onGreen:#ffffff;
  --mark:#c2410c; --sand:#ead9a6; --sand-d:#b89a52; --grass:#cfe3c9; --greenTop:#9fcf9a; --skin:#f2c9a5; --skin2:#e8b88f; --holec:#15281c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --fs:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --surface:#17231b; --ink:#e8f0ea; --muted:#a6b8ac; --line:#2b3b30;
  --green:#5fbf84; --green-2:#7fd3a0; --green-soft:#1d3325; --flag:#f2c230; --flag-ink:#2a2000;
  --alert:#ff8f80; --alert-soft:#3a1c18; --onGreen:#0c1a11; --mark:#fb923c; --sand:#5c4f2e; --sand-d:#a38a4f; --grass:#1f3a27; --greenTop:#2e5a3a; --skin:#d9a982; --skin2:#c99570; --holec:#050805; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#17231b; --ink:#e8f0ea; --muted:#a6b8ac; --line:#2b3b30;
  --green:#5fbf84; --green-2:#7fd3a0; --green-soft:#1d3325; --flag:#f2c230; --flag-ink:#2a2000;
  --alert:#ff8f80; --alert-soft:#3a1c18; --onGreen:#0c1a11; --mark:#fb923c; --sand:#5c4f2e; --sand-d:#a38a4f; --grass:#1f3a27; --greenTop:#2e5a3a; --skin:#d9a982; --skin2:#c99570; --holec:#050805; color-scheme:dark}
:root[data-size="lg"]{--fs:21px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.55;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2.2em} h2{font-size:1.75em} h3{font-size:1.3em}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.8em;font-weight:600;color:var(--green)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.35em}
.brand svg{flex:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 .72em var(--body);padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:64px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current="page"]{color:var(--green)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.hero{background:var(--green);color:var(--onGreen);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{color:var(--flag)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 22px;border-radius:999px;border:2px solid transparent;font:700 1em var(--body);cursor:pointer;text-decoration:none}
.btn-primary{background:var(--flag);color:var(--flag-ink)}
.btn-green{background:var(--green);color:var(--onGreen)}
.btn-ghost{background:transparent;color:var(--green);border-color:var(--green)}
.btn-small{min-height:44px;padding:8px 16px;font-size:.9em}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
/* Scorecard */
.score{overflow-x:auto}
.score table{border-collapse:collapse;width:100%;min-width:520px;font-variant-numeric:tabular-nums}
.score th,.score td{border:1px solid var(--line);padding:8px 6px;text-align:center}
.score th{font-family:var(--display);font-weight:600;font-size:.85em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--green-soft)}
.score td.lbl,.score th.lbl{text-align:left;padding-left:10px;white-space:nowrap}
.dot{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:.8em}
.dot.done{background:var(--green);border-color:var(--green);color:var(--onGreen)}
.dot.now{border-color:var(--flag);background:var(--flag);color:var(--flag-ink)}
/* Lesson list */
.holes{display:grid;gap:10px}
.hole{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.hole .n{font-family:var(--display);font-weight:700;font-size:1.6em;color:var(--green);text-align:center;line-height:1}
.hole .n small{display:block;font-size:.42em;letter-spacing:.12em;color:var(--muted)}
.hole .t{min-width:0}
.hole .t b{display:block}
.pill{font-size:.75em;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.pill.now{background:var(--flag);color:var(--flag-ink)}
.pill.done{background:var(--green);color:var(--onGreen)}
/* Lesson */
.steps-nav{display:flex;gap:8px}
.steps-nav span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.steps-nav span.on{background:var(--green)}
.step-big{font-size:1.15em}
.term{border-bottom:2px dotted var(--green);cursor:help;background:none;border-top:0;border-left:0;border-right:0;color:inherit;font:inherit;padding:0}
.gloss{background:var(--green-soft);border-radius:10px;padding:12px 14px}
.tip{border-left:5px solid var(--flag);background:var(--surface);padding:12px 16px;border-radius:0 10px 10px 0}
.alert{border:2px solid var(--alert);background:var(--alert-soft);color:var(--ink);border-radius:var(--r);padding:16px 18px}
.alert b{color:var(--alert)}
.counter{display:flex;align-items:center;gap:18px;justify-content:center}
.counter output{font-family:var(--display);font-size:3em;font-weight:700;min-width:2.5ch;text-align:center;font-variant-numeric:tabular-nums}
.round{width:64px;height:64px;border-radius:50%;border:2px solid var(--green);background:var(--surface);color:var(--green);font-size:1.6em;font-weight:700;cursor:pointer}
/* Ilustraciones */
.illo{margin:0;background:var(--green-soft);border-radius:12px;overflow:hidden;position:relative}
.illo-svg{display:block;width:100%;height:auto}
.illo-play{position:absolute;right:8px;top:8px;background:var(--surface)}
.illo .limb{stroke:var(--ink);stroke-width:7;stroke-linecap:round;fill:none}
.illo .shirt{fill:var(--green-2);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.illo .club{stroke:var(--muted);stroke-width:3;stroke-linecap:round;fill:none}
.illo .clubhead{fill:var(--muted)}
.illo .hand,.illo .head{fill:var(--skin);stroke:var(--ink);stroke-width:2}
.illo .cap{fill:var(--flag);stroke:var(--ink);stroke-width:2}
.illo .ghost{opacity:.2}
.illo .ball{fill:#fff;stroke:var(--ink);stroke-width:1.5}
.illo .grass,.illo .grassTop{fill:var(--grass)} .illo .sand,.illo .sandTop{fill:var(--sand)}
.illo .groundline{stroke:var(--ink);stroke-width:1.5;opacity:.45}
.illo .pole{stroke:var(--ink);stroke-width:2} .illo .flagc{fill:var(--alert)} .illo .hole{fill:var(--holec)}
.illo .mark{stroke:var(--mark);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.illo .mark2{stroke:var(--green);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.illo .dash{stroke-dasharray:5 5}
.illo .guide{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 5;opacity:.55;fill:none}
.illo .guide.strong{stroke:var(--mark);opacity:1;stroke-width:2.5}
.illo .lbl{fill:var(--ink);font:700 14px var(--body)} .illo .lbl.small{font-size:12.5px}
.illo .big{fill:var(--mark);font:700 28px var(--display)}
.illo .tri{fill:var(--mark);fill-opacity:.18;stroke:var(--mark);stroke-width:2}
.illo .traj{stroke:var(--mark);stroke-width:2.5;fill:none;stroke-dasharray:6 5} .illo .roll{stroke-dasharray:2 5}
.illo .clock{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 6;opacity:.5}
.illo .okc{fill:var(--surface);stroke:var(--green);stroke-width:3} .illo .okt{stroke:var(--green);stroke-width:3.5;fill:none;stroke-linecap:round}
.illo .splash circle{fill:var(--sand-d)}
.illo .shaftbig{stroke:var(--muted);stroke-width:10;stroke-linecap:round} .illo .gripend{stroke:var(--ink);stroke-width:16;stroke-linecap:round}
.illo .handbig{fill:var(--skin);stroke:var(--ink);stroke-width:2.5} .illo .h2{fill:var(--skin2)}
.illo .thumb{stroke:var(--ink);stroke-width:2.5;fill:none} .illo .knuck{fill:var(--mark)}
.illo .meter{fill:var(--surface);stroke:var(--line);stroke-width:2} .illo .meter.on{fill:var(--mark);stroke:var(--mark)}
.illo .meternum{font:700 11px var(--body);fill:var(--muted)} .illo .meternum.on{fill:#fff}
.illo .rail{stroke:var(--mark);stroke-width:3} .illo .shoe{fill:var(--ink)}
.illo .greenTop{fill:var(--greenTop)} .illo .routeline{stroke:var(--ink);opacity:.5;stroke-width:2.5;stroke-dasharray:6 6;fill:none}
.illo .pitch{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3} .illo .tool{fill:var(--ink)} .illo .toolprongs{stroke:var(--ink);stroke-width:3}
.illo .card2{fill:var(--surface);stroke:var(--line);stroke-width:2} .illo .rule{stroke:var(--line);stroke-width:2}
.illo .headTop{fill:var(--muted);stroke:var(--ink);stroke-width:2} .illo .headTop.closed{opacity:.25}
/* Chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:240px}
.msg{max-width:88%;padding:12px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--green);color:var(--onGreen);align-self:flex-end;border-bottom-right-radius:6px}
.msg.warn{background:var(--alert-soft);border:2px solid var(--alert)}
.msg img{display:block;max-width:220px;border-radius:10px;margin-bottom:6px}
.msg .say{margin-top:6px}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.composer .row{flex-wrap:nowrap}
textarea,input[type=text],input[type=password],input[type=number],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px}
textarea{resize:vertical;min-height:56px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
label.f span.h{font-weight:400;color:var(--muted);font-size:.88em}
.icon-btn{flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--green);background:var(--surface);color:var(--green);display:grid;place-items:center;cursor:pointer}
.icon-btn.on{background:var(--alert);border-color:var(--alert);color:#fff}
.icon-btn svg{width:26px;height:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:.92em;cursor:pointer;min-height:48px}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
.result{background:var(--green);color:var(--onGreen);border-radius:var(--r);padding:20px}
.result .club{font-family:var(--display);font-size:2.4em;font-weight:700;line-height:1}
.seg{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.opt input{width:22px;height:22px;margin-top:3px;accent-color:var(--green)}
.status{font-size:.88em;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;z-index:30;font-weight:700;max-width:90vw;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:760px){
  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border:1px solid var(--line);border-radius:999px;max-width:760px;margin:0 auto 18px;padding:4px;grid-template-columns:repeat(5,1fr)}
  nav.tabs button{flex-direction:row;justify-content:center;min-height:52px;font-size:.85em;border-radius:999px}
  nav.tabs button[aria-current="page"]{background:var(--green-soft)}
  .composer{bottom:0}
  .wrap{padding-block:18px 40px}
}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<script>
(() => {
"use strict";

/* ---------------- Contenido ---------------- */
const TERMS = {
  "agarre":"La forma de tomar el palo con las manos.",

const WARMUP = [
  "Camina 2 minutos a paso tranquilo.",
  "Haz 10 círculos suaves con los hombros, hacia atrás.",

 {id:"agarre", title:"El agarre", goal:"Tomar el palo de forma firme pero suave.", terms:["agarre","palo"],

 {id:"postura", title:"Postura y alineación", goal:"Pararte cómodo, estable y apuntando bien.", terms:["postura","alineación","línea de objetivo"],

function dictate(target, btn){

    const base = target.value ? target.value.trim()+" " : "";

async function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); }); }

/* Llama a cualquier proveedor con el mismo formato de mensajes. */
async function callProvider(prov, key, model, system, history, image, signal){
  const img = image ? {type:image.type||"image/jpeg", data: await blobToB64(image)} : null;
  let url, headers, body, pick;
  if (prov==="anthropic") {
    const msgs = history.map(m => ({role:m.role, content:m.content}));
    if (img) { const l=msgs[msgs.length-1]; l.content=[{type:"image", source:{type:"base64", media_type:img.type, data:img.data}}, {type:"text", text:l.content}]; }
    url="https://api.anthropic.com/v1/messages";
    headers={"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
    body={model, max_tokens:700, system, messages:msgs};
    pick=j=>(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  } else if (prov==="gemini") {
    const contents = history.map(m => ({role:m.role==="assistant"?"model":"user", parts:[{text:m.content}]}));
    if (img) contents[contents.length-1].parts.unshift({inline_data:{mime_type:img.type, data:img.data}});
    url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent";
    headers={"content-type":"application/json","x-goog-api-key":key};
    body={systemInstruction:{parts:[{text:system}]}, contents, generationConfig:{maxOutputTokens:2048}};
    pick=j=>((j.candidates||[])[0]?.content?.parts||[]).filter(p=>p.text && !p.thought).map(p=>p.text).join("");
  } else {
    const msgs = [{role:"system", content:system}, ...history.map(m => ({role:m.role, content:m.content}))];
    if (img) { const l=msgs[msgs.length-1]; l.content=[{type:"text", text:l.content}, {type:"image_url", image_url:{url:"data:"+img.type+";base64,"+img.data}}]; }
    url="https://api.openai.com/v1/chat/completions";
    headers={"content-type":"application/json","authorization":"Bearer "+key};
    body={model, messages:msgs, max_completion_tokens:2048};
    pick=j=>(j.choices||[])[0]?.message?.content||"";
  }
  let r;
  try { r = await fetch(url, {method:"POST", signal, headers, body:JSON.stringify(body)}); }
  catch(e) { if (e && e.name==="AbortError") throw {code:"cancelled"}; throw {code:"blocked"}; }
  if (!r.ok) { let m=""; try{ const j=await r.json(); m=j.error?.message||(typeof j.error==="string"?j.error:""); }catch(e){} throw {code:"http", message:m||("Error "+r.status)}; }
  const text = pick(await r.json()).trim();
  if (!text) throw {code:"empty"};
  return text;
}

async function askAI(history, image, onText, signal){
  if (S.ai === "off") throw {code:"off"};

    const key = (S.keys||{})[S.ai]; if (!key) throw {code:"nokey"};

    const text = await callProvider(S.ai, key, model, teacherRules(), history, image, signal);

  const opts = {cache:false, signal, onText: ({text}) => onText && onText(text)};

}
/* Fuera de Claude: usa el servidor de la web (/api/chat), que guarda la clave de forma segura. */
async function askServer(history, image, onText, signal){
  const L = LESSONS[S.current];
  const profile = `Alumno: ${S.name||"sin nombre"}. Mano: ${S.hand}. Limitaciones: ${S.limits||"ninguna indicada"}. Lección actual: ${S.current+1} de 8, "${L.title}".`;
  const body = {profile, messages: history.map(m => ({role:m.role, content:m.content}))};
  if (image) body.image = {type: image.type || "image/jpeg", data: await blobToB64(image)};
  // Límite de espera: si tarda más de 45 segundos, se corta con un mensaje claro.
  const ctl2 = new AbortController(); let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; ctl2.abort(); }, 45000);
  if (signal) signal.addEventListener("abort", () => ctl2.abort(), {once:true});
  let r;
  try { r = await fetch("/api/chat", {method:"POST", signal: ctl2.signal, headers:{"content-type":"application/json"}, body: JSON.stringify(body)}); }
  catch(e) { clearTimeout(timer); if (timedOut) throw {code:"timeout"}; if (e && e.name==="AbortError") throw {code:"cancelled"}; throw {code:"network"}; }
  clearTimeout(timer);
  if (r.status===404 || r.status===405) throw {code:"nosample"};
  if (r.status===429) throw {code:"rate_limited"};
  if (r.status===504) throw {code:"timeout"};
  if (!r.ok) { let j={}; try{ j=await r.json(); }catch(e){} if (j.code==="busy") throw {code:"busy"}; throw {code: r.status===503?"nokeyserver":"server", message:j.error||""}; }
  const j = await r.json(); const text = j.text || "";
  onText && onText(text); return text;
}

/* ---------------- Ilustraciones ---------------- */
const GY = 214; // línea del suelo
const rad = d => d * Math.PI / 180;
const P2 = (x, y) => ({x, y});
const f1 = n => Math.round(n * 10) / 10;
const ln = (a, b, cls) => `<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}" class="${cls}"/>`;

/* Golfista visto de frente. th: ángulo del swing (0 = preparación, negativo = hacia atrás). */
function frontPose(o){
  const p = {th:0, hinge:0, turn:0, shift:0, st:26, heelF:0, heelR:0, club:58, ...o};
  const P = P2(160 + p.shift * .5, 90);
  const L = 66;
  const H = P2(P.x + L * Math.sin(rad(p.th)), P.y + L * Math.cos(rad(p.th)));
  const a = p.th + p.hinge;
  const C = P2(H.x + p.club * Math.sin(rad(a)), H.y + p.club * Math.cos(rad(a)));
  const w = 25 * (1 - .45 * p.turn);
  const S1 = P2(P.x - w, P.y + 2), S2 = P2(P.x + w, P.y + 2);
  const Hp = P2(160 + p.shift, 144);
  const F1 = P2(160 - p.st, GY - 2 - p.heelR * 6), F2 = P2(160 + p.st, GY - 2 - p.heelF * 6);
  const K1 = P2((Hp.x - 9 + F1.x) / 2 + 3 + p.heelR * 16, 180 - p.heelR * 3);
  const K2 = P2((Hp.x + 9 + F2.x) / 2 - 3 - p.heelF * 12, 180 - p.heelF * 3);
  const head = P2(160 + p.shift * .15, 66);
  return {P, H, C, S1, S2, Hp, F1, F2, K1, K2, head, p};
}
function drawFront(g, cls = ""){
  const {H, C, S1, S2, Hp, F1, F2, K1, K2, head, p} = g;
  const foot = (F, heel, dir) => heel > .3
    ? ln(F, P2(F.x + dir * 9, F.y + 4), "limb") /* sólo la punta apoyada */
    : `<path d="M${f1(F.x - 9)} ${GY}h18" class="limb"/>`;
  return `<g class="fig ${cls}">
    ${ln(P2(Hp.x - 9, Hp.y), K1, "limb")}${ln(K1, F1, "limb")}${foot(F1, p.heelR, 1)}
    ${ln(P2(Hp.x + 9, Hp.y), K2, "limb")}${ln(K2, F2, "limb")}${foot(F2, p.heelF, -1)}

function sceneSvg(key, poseOverride){
  const sc = SCENES[key]; if (!sc) return "";
  let body = "";
  if (sc.raw) body = sc.raw();
  else if (sc.side) { const g = sideFig(sc.side); body = ground() + ball(g.B.x + 6) + g.svg + (sc.notes ? sc.notes(g) : ""); }
  else {
    const pose = poseOverride || sc.front || sc.anim[0];
    const g = frontPose(pose);
    const bx = sc.ballX || 160;
    body = ground(sc.ground);
    if (sc.anim && !poseOverride) body += drawFront(frontPose(sc.anim[1]), "ghost");
    if (sc.ghost) body += drawFront(frontPose(sc.ghost), "ghost");
    body += ball(bx) + `<g class="figwrap">${drawFront(g)}${sc.figNotes ? sc.figNotes(g) : ""}</g>` + (sc.notes ? sc.notes(g) : "");
  }
  return `<svg viewBox="0 0 320 240" role="img" aria-label="${esc(sc.alt)}" class="illo-svg">${body}</svg>`;
}

/* Animación suave de ida y vuelta (ritmo lento, como debe ser el swing) */
let animRAF = 0;
function stopAnim(){ cancelAnimationFrame(animRAF); animRAF = 0; }
function startAnim(el, key){
  stopAnim();
  const sc = SCENES[key]; if (!sc || !sc.anim) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const [A, B] = sc.anim, wrap = el.querySelector(".figwrap"); if (!wrap) return;
  const ghost = el.querySelector(".ghost"); if (ghost) ghost.remove();
  const period = 2600, t0 = performance.now();
  const mix = (k) => { const o = {}; for (const n of new Set([...Object.keys(A), ...Object.keys(B)])) { const a = A[n] ?? 0, b = B[n] ?? 0; o[n] = a + (b - a) * k; } return o; };
  const tick = (now) => {
    if (!document.body.contains(wrap)) return stopAnim();
    const ph = ((now - t0) % period) / period;              // 0..1
    const k = .5 - .5 * Math.cos(ph * 2 * Math.PI);          // ida y vuelta, suave
    const g = frontPose(mix(k)); wrap.innerHTML = drawFront(g) + (sc.figNotes ? sc.figNotes(g) : "");
    animRAF = requestAnimationFrame(tick);
  };
  animRAF = requestAnimationFrame(tick);
}
function illoHtml(key){
  const sc = SCENES[key]; if (!sc) return "";
  return `<figure class="illo" data-scene="${key}">${sceneSvg(key)}${sc.anim ? `<button type="button" class="btn btn-ghost btn-small illo-play" aria-pressed="true">Pausar</button>` : ""}</figure>`;
}
function wireIllo(root){
  const fig = root.querySelector(".illo"); if (!fig) return;
  const key = fig.dataset.scene; startAnim(fig, key);
  const b = fig.querySelector(".illo-play"); if (!b) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { b.textContent = "Ver movimiento"; b.setAttribute("aria-pressed", "false"); }
  b.onclick = () => {
    if (animRAF) { stopAnim(); b.textContent = "Ver movimiento"; b.setAttribute("aria-pressed", "false"); }
    else { fig.querySelector("svg").outerHTML = sceneSvg(key); runAnyway(fig, key); b.textContent = "Pausar"; b.setAttribute("aria-pressed", "true"); }
  };
}
function runAnyway(fig, key){
  const sc = SCENES[key]; const [A, B] = sc.anim; const wrap = fig.querySelector(".figwrap");
  const ghost = fig.querySelector(".ghost"); if (ghost) ghost.remove();
  const period = 2600, t0 = performance.now();
  const mix = (k) => { const o = {}; for (const n of new Set([...Object.keys(A), ...Object.keys(B)])) { const a = A[n] ?? 0, b = B[n] ?? 0; o[n] = a + (b - a) * k; } return o; };
  const tick = (now) => { if (!document.body.contains(wrap)) return stopAnim(); const k = .5 - .5 * Math.cos(((now - t0) % period) / period * 2 * Math.PI); const g = frontPose(mix(k)); wrap.innerHTML = drawFront(g) + (sc.figNotes ? sc.figNotes(g) : ""); animRAF = requestAnimationFrame(tick); };
  stopAnim(); animRAF = requestAnimationFrame(tick);
}

function linkTerms(text, terms){
  let out = esc(text);
  terms.forEach(t => { const re = new RegExp("(^|[^\\wáéíóúñ])("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\wáéíóúñ])","i");
    out = out.replace(re, (m,a,b)=>`${a}<button type="button" class="term" data-term="${esc(t)}">${b}</button>`); });
  return out;
}

function offlineAnswer(text){
  if (/palo/i.test(text)) return "usa la sección \"¿Qué palo?\". Te pregunto la distancia y el lugar, y te recomiendo uno.";
  if (/calent/i.test(text)) return WARMUP.map((w,i)=>(i+1)+". "+w).slice(0,3).join("\n")+"\nSigue con el resto en la sección de calentamiento.";
  const L=LESSONS[S.current]; return "tu lección de hoy es "+L.title.toLowerCase()+".\n"+L.steps.map((s,i)=>(i+1)+". "+s.t+": "+s.d).join("\n")+"\n¿Quieres seguir o practicar?";
}
async function thumb(file){
  const bmp = await createImageBitmap(file); const s = Math.min(1, 360/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); return c.toDataURL("image/jpeg",.7);
}

/* ---------------- ¿Qué palo? ---------------- */
const LIES = [["calle","Calle","pasto corto"],["rough","Rough","pasto alto"],["arena","Arena","búnker"],["green","Green","cerca del hoyo"],["tee","Tee","primer golpe"]];
function recommend(dist, lie){
  if (lie==="green") return {club:"Putter", why:"En el green la bola debe rodar. El putter es el palo para eso."};
  if (lie==="arena") return dist<=40 ? {club:"Sand wedge", why:"Su forma se desliza por la arena y saca la bola hacia arriba."}
    : {club:"Hierro 9", why:"Desde un búnker lejos del green, el hierro 9 saca la bola limpia y sube rápido. Golpea la bola primero."};
  if (dist<=25) return {club:"Hierro 8 (chip)", why:"Cerca del green, un chip con hierro 8 vuela poco y rueda. Es el golpe más seguro."};
  if (dist<=45) return {club:"Sand wedge", why:"Para distancias cortas sube alto y cae suave. Usa un medio swing."};
  if (dist<=65) return {club: lie==="rough"?"Pitching wedge":"Pitching wedge", why:"Para esta distancia, con un swing de tres cuartos y buen ritmo."};
  if (dist<=80) return {club:"Hierro 9", why:"Sube fácil y es preciso. Swing de tres cuartos, sin forzar."};
  if (dist<=95) return {club:"Hierro 7", why:"Es un palo versátil y cómodo. Swing suave, de tres cuartos."};
  if (lie==="rough") return {club:"Híbrido", why:"En el pasto alto, el híbrido se desliza mejor que un hierro largo y es más fácil."};
  if (dist<=125) return {club:"Híbrido", why:"Es más fácil de pegar que los hierros largos. Ideal para principiantes."};
  if (lie==="tee") return {club:"Madera 3 o driver", why:"Desde el tee, con la bola en el soporte, llegas más lejos. Si te cuesta, usa el híbrido."};
  return {club:"Híbrido", why:"Desde la calle a esa distancia, el híbrido es más seguro que una madera. Mejor un golpe bueno que uno largo."};
}

      <h3>Privacidad</h3>
      <p class="muted">${esc(PRIVACY)}</p>
      <p class="muted">Si eliges "Sin IA", la app no envía nada a internet.</p>
    </div>
    <div class="card stack">
      <h3>Mis datos</h3>
      <label class="f">Nombre<input id="nm2" type="text" value="${esc(S.name)}"></label>
      <label class="f">Molestias físicas<input id="lim2" type="text" value="${esc(S.limits)}" placeholder="Ej.: dolor lumbar"></label>
      <label class="f">Mano<select id="hand2"><option value="derecha" ${S.hand==="derecha"?"selected":""}>Derecha</option><option value="izquierda" ${S.hand==="izquierda"?"selected":""}>Izquierda</option></select></label>
      <div class="row"><button type="button" class="btn btn-green" id="saveAll">Guardar ajustes</button></div>
    </div>
    <div class="card stack">
      <h3>Empezar de nuevo</h3>
      <p class="muted">Borra tu avance y la conversación de este dispositivo.</p>
      <div class="row" id="resetRow"><button type="button" class="btn btn-ghost" id="reset">Borrar mi avance</button></div>
    </div>
  </section>`;
  const drawKey=()=>{ const k=app.querySelector('input[name=ai]:checked').value, p=PROVIDERS[k], box=$("#keyBox");
    if(!p){ box.hidden=true; box.innerHTML=""; return; } box.hidden=false;
    box.innerHTML=`<label class="f">Clave de ${p.name}<span class="h">${p.hint} Se guarda solo en este dispositivo.</span><input id="key" type="password" autocomplete="off" value="${esc((S.keys||{})[k]||"")}" placeholder="${p.ph}"></label>
      <label class="f">Modelo<span class="h">Puedes cambiarlo cuando salga uno nuevo.</span><input id="model" type="text" value="${esc((S.models||{})[k]||p.model)}"></label>
      <div class="row"><button type="button" class="btn btn-ghost btn-small" id="testKey">Probar conexión</button><span class="status" id="testOut"></span></div>
      <p class="status">No compartas tu clave con nadie.</p>`;
    $("#testKey").onclick=async()=>{ const out=$("#testOut"); out.textContent="Probando…";
      try{ const t=await callProvider(k, $("#key").value.trim(), $("#model").value.trim()||p.model, "Responde en español con una frase corta.", [{role:"user",content:"Saluda a un alumno de golf."}], null); out.textContent="Funciona: "+t.slice(0,80); }
      catch(e){ out.textContent=aiErrorCopy(e); } };
  };
  app.querySelectorAll('input[name=ai]').forEach(r=>r.onchange=drawKey); drawKey();
  $("#saveAll").onclick=()=>{
    S.ai = app.querySelector('input[name=ai]:checked').value;
    if (PROVIDERS[S.ai]) { S.keys={...S.keys,[S.ai]:$("#key").value.trim()}; S.models={...S.models,[S.ai]:$("#model").value.trim()||PROVIDERS[S.ai].model}; }
    S.voiceOn=$("#voiceOn").checked; S.autoRead=$("#autoRead").checked; S.rate=+$("#rate").value;
    const vs=$("#voice"); if(vs) S.voiceName=vs.value;
    S.name=$("#nm2").value.trim(); S.limits=$("#lim2").value.trim(); S.hand=$("#hand2").value;
    save(); toast("Ajustes guardados.");
  };
  $("#rate").oninput=e=>{ S.rate=+e.target.value; };
  const vsel=$("#voice"); if (vsel) vsel.onchange=()=>{ S.voiceName=vsel.value; save(); speak("Hola. Así sueno. Vamos con calma."); };
  $("#reset").onclick=()=>{ $("#resetRow").innerHTML=`<span>¿Seguro? Esto no se puede deshacer.</span><button type="button" class="btn btn-ghost btn-small" id="no">No, volver</button><button type="button" class="btn btn-small" style="background:var(--alert);color:#fff" id="yes">Sí, borrar</button>`;
    $("#no").onclick=()=>render(); $("#yes").onclick=()=>{ const keep={ai:S.ai,keys:S.keys,models:S.models,size:S.size}; S={...defaults,...keep}; save(); toast("Avance borrado."); go("inicio"); }; };
}

if (synth && synth.onvoiceschanged!==undefined) synth.onvoiceschanged = () => { if (view==="ajustes" && !document.getElementById("voice")) render(); };
render();
})();
</script>
</body></html>
